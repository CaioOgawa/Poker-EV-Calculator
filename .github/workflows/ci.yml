name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy — core/ and engine/)
        run: mypy core engine

      - name: Test (fast — skips Monte Carlo / equity sweeps)
        run: pytest tests/ --no-cov -v -m "not slow"

  test-slow:
    # Full suite including Monte Carlo / equity sweeps (~1-2 min). Runs only
    # on pushes to main so PRs get fast feedback from the job above without
    # waiting on the statistical suites.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (full, including slow)
        run: pytest tests/ --no-cov -v

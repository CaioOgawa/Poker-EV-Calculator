name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install treys numpy scipy pandas matplotlib seaborn plotly rich tqdm joblib
          pip install scikit-learn xgboost typer
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest tests/ --no-cov -v

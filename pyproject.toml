[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-ev-calculator"
version = "0.1.0"
description = "Poker EV Calculator — monorepo with quant, expert, and vision modules"
authors = [{name = "CaioOgawa", email = "caiokootaogawa@gmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
poker = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engine*", "risk*", "simulation*", "vision*", "output*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
markers = [
    "slow: Monte Carlo / equity sweeps — skip with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-ev-calculator"
version = "0.1.0"
description = "Poker EV Calculator — monorepo with quant, expert, and vision modules"
authors = [{name = "CaioOgawa", email = "caiokootaogawa@gmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "treys>=0.1.8",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8.0"]
vision = ["opencv-python>=4.9.0", "pytesseract>=0.3.10", "Pillow>=10.3.0"]
dev = ["pytest>=8.1.0", "pytest-cov>=5.0.0", "ruff", "pre-commit"]

[project.scripts]
poker = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "engine*", "risk*", "simulation*", "vision*", "output*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"
markers = [
    "slow: Monte Carlo / equity sweeps — skip with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

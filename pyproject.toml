[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "poker-ev-calculator"
version = "0.1.0"
description = "Poker EV Calculator — monorepo with quant, expert, and vision modules"
authors = [{name = "CaioOgawa", email = "caiokootaogawa@gmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

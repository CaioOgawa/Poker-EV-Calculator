repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast — skips slow Monte Carlo suites)
        entry: .venv/bin/python -m pytest tests/unit/ -m "not slow" -q --no-cov
        language: system
        pass_filenames: false
        always_run: true
